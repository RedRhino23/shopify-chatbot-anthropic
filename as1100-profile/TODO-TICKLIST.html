<div class="bar"><button type="button" id="copy">Copy the list</button><button type="button" id="clear" class="quiet">Untick everything</button><span id="status" role="status"></span></div>
<textarea id="out" readonly aria-label="List as text"></textarea>
</main>
<script>
(function(){
var KEY="as1100-todo-2026-11-13",f=document.getElementById("f"),out=document.getElementById("out");
function tasks(){return [].slice.call(f.querySelectorAll(".task"));}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");tasks().forEach(function(t){var id=t.dataset.id;if(s[id]){t.querySelector("input[type=checkbox]").checked=!!s[id].d;t.querySelector("input[type=text]").value=s[id].n||"";}});}catch(e){}}
function save(){try{var s={};tasks().forEach(function(t){s[t.dataset.id]={d:t.querySelector("input[type=checkbox]").checked,n:t.querySelector("input[type=text]").value};});localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function render(){
 var done=0,all=tasks().length,flt=document.getElementById("filter").value,lines=["AS 1100 and pipeline: to do (13/11/2026)",""];
 tasks().forEach(function(t){var c=t.querySelector("input[type=checkbox]").checked,n=t.querySelector("input[type=text]").value.trim();
  t.classList.toggle("done",c);if(c)done++;
  var show=flt==="all"||flt===t.dataset.who||(flt==="open"&&!c);t.style.display=show?"":"none";
  lines.push((c?"[x] ":"[ ] ")+t.dataset.who+": "+t.querySelector("label").textContent.replace(t.dataset.who.toUpperCase(),"").trim()+(n?"  NOTE: "+n:""));});
 document.getElementById("count").textContent=done+" of "+all+" done";out.value=lines.join("\n");save();}
f.addEventListener("input",render);f.addEventListener("change",render);document.getElementById("filter").addEventListener("change",render);
document.getElementById("copy").addEventListener("click",function(){var st=document.getElementById("status");try{navigator.clipboard.writeText(out.value).then(function(){st.textContent="Copied.";},function(){out.select();st.textContent="Selected. Press Ctrl+C.";});}catch(e){out.select();st.textContent="Selected. Press Ctrl+C.";}});
document.getElementById("clear").addEventListener("click",function(){tasks().forEach(function(t){t.querySelector("input[type=checkbox]").checked=false;});render();});
load();render();
})();
</script></body></html>
